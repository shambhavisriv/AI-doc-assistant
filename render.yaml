services:
  - type: web
    name: ai-doc-assistant
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_DB
        value: ai-doc-assistant
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
